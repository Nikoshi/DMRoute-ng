name: .NET Core Test & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test and Collect Coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Generate HTML Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: 'tests/DMRoute_ng.Tests/TestResults/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'Html;Badges'

      - name: Upload Test Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build-and-test

    # Hier definieren wir die Matrix für beide Betriebssysteme
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            artifact_name: DMRoute-ng-linux-x64
          - os: windows-latest
            runtime: win-x64
            artifact_name: DMRoute-ng-win-x64

    runs-on: ${{ matrix.os }}

    # Behebt den 403-Fehler: Erlaubt das Schreiben von Releases und Paketen
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Publish Highly Optimized Binary
        # Nutzt die Variablen aus der Matrix für den jeweiligen Runner
        run: |
          dotnet publish src/DMRoute_ng/DMRoute-ng.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            -p:PublishAot=true \
            -p:OptimizationPreference=Speed \
            -p:IlcGenerateMsvcBindOptions=true \
            --output ./publish/${{ matrix.artifact_name }}

      # Da Windows und Linux parallel laufen, nutzen wir "contents: write", 
      # damit beide Runner ihre Datei sicher in dasselbe Release hochladen können.
      # softprops/action-gh-release unterstützt das parallele Hochladen automatisch.
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          draft: false
          prerelease: false
          files: ./publish/${{ matrix.artifact_name }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
