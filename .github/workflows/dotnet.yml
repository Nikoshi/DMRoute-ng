name: .NET Core Test & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test and Collect Coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Generate HTML Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: 'tests/DMRoute_ng.Tests/TestResults/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'Html;Badges'

      - name: Upload Test Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport

  release:
    # Triggert nur bei Pushes auf main/master, nicht bei Pull Requests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Publish Highly Optimized Binary
        # --runtime linux-x64 erzwingt eine native, eigenständige ausführbare Datei
        run: |
          dotnet publish src/DMRoute_ng/DMRoute-ng.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:OptimizationPreference=Speed \
            -p:IlcGenerateMsvcBindOptions=true \
            --output ./publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          draft: false
          prerelease: false
          files: ./publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
