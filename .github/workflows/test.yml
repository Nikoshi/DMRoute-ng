name: .NET Core Test & Coverage

on:
  push:
  # Führt den Workflow bei jedem Push auf einen beliebigen Branch aus
  pull_request:
  # Führt den Workflow bei jedem Pull Request auf einen beliebigen Branch aus

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test and Collect Coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Generate HTML Report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: 'tests/DMRoute_ng.Tests/TestResults/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'Html;Badges'

      - name: Upload Test Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coveragereport

  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate and build documentation
        run: make docs

      - name: Upload PDF documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: artifacts/docs/*.pdf
          if-no-files-found: error

  experimental-voice-encoder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Test experimental voice encoder
        run: make blip25-test

  playground:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            artifact: emulator-playground-linux-x64
          - os: windows-latest
            runtime: win-x64
            artifact: emulator-playground-win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Publish self-contained playground
        shell: bash
        run: |
          dotnet publish tools/DMRoute_ng.Playground/DMRoute_ng.Playground.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            --output ./publish/${{ matrix.artifact }}

      - name: Build and bundle OpenDMR codec
        if: matrix.runtime == 'linux-x64'
        shell: bash
        run: |
          make opendmr-test
          cp artifacts/opendmr/dmr_codec ./publish/${{ matrix.artifact }}/
          cp THIRD-PARTY-NOTICES.md ./publish/${{ matrix.artifact }}/
          cp third_party/OpenDMR/LICENSE ./publish/${{ matrix.artifact }}/OpenDMR-LICENSE
          cp third_party/OpenDMR/decoder/CREDITS ./publish/${{ matrix.artifact }}/OpenDMR-decoder-CREDITS
          cp third_party/OpenDMR/encoder/CREDITS ./publish/${{ matrix.artifact }}/OpenDMR-encoder-CREDITS
          tar -czf ./publish/${{ matrix.artifact }}/OpenDMR-1.0.0+dmroute.2-source.tar.gz -C third_party OpenDMR

      - name: Upload playground
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/${{ matrix.artifact }}
          if-no-files-found: error
