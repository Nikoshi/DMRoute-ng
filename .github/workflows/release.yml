name: .NET Core Native Release

on:
  workflow_run:
    workflows: [ ".NET Core Test & Coverage" ] # Muss exakt dem 'name' der ersten Datei entsprechen
    types:
      - completed
    branches:
      - main
      - master

jobs:
  release:
    # Triggert NUR, wenn der Test-Workflow ERFOLGREICH war
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            artifact_name: DMRoute-ng-linux-x64
          - os: windows-latest
            runtime: win-x64
            artifact_name: DMRoute-ng-win-x64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write
      packages: write
    
    steps:
      # Da workflow_run im Kontext des Default-Branches startet, checken wir 
      # hier explizit den exakten Commit aus, der den Test ausgelöst hat
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set Short SHA
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Publish Highly Optimized Binary
        shell: bash
        run: |
          dotnet publish src/DMRoute_ng/DMRoute-ng.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            -p:PublishAot=true \
            -p:OptimizationPreference=Speed \
            -p:IlcGenerateMsvcBindOptions=true \
            --output ./publish/${{ matrix.artifact_name }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.vars.outputs.sha_short }}
          name: Release ${{ steps.vars.outputs.sha_short }}
          draft: false
          prerelease: false
          files: ./publish/${{ matrix.artifact_name }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
