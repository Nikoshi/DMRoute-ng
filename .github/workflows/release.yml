name: .NET Core Native Release

on:
  workflow_run:
    workflows: [ ".NET Core Test & Coverage" ]
    types:
      - completed
    branches:
      - main
      - master

jobs:
  linux-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set short SHA
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Nix
        uses: cachix/install-nix-action@v31

      - name: Build reproducible Linux release bundle
        run: nix build .#releaseBundle --print-build-logs

      - name: Add Linux programs and documentation to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-release-${{ steps.vars.outputs.sha_short }}
          name: CI Release ${{ steps.vars.outputs.sha_short }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            result/DMRoute-ng-linux-x64/*
            result/DMRoute-ng-playground-linux-x64.tar.gz
            result/docs/DMRoute-ng-Handbuch.pdf
            result/docs/DMRoute-ng-Hardwaretests.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set short SHA
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Publish NativeAOT binary
        shell: bash
        run: |
          dotnet publish src/DMRoute_ng/DMRoute-ng.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            -p:PublishAot=true \
            -p:OptimizationPreference=Speed \
            -p:IlcGenerateMsvcBindOptions=true \
            --output ./publish/DMRoute-ng-win-x64

      - name: Add Windows program to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-release-${{ steps.vars.outputs.sha_short }}
          name: CI Release ${{ steps.vars.outputs.sha_short }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ./publish/DMRoute-ng-win-x64/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs:
      - linux-release
      - windows-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Delete older CI releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 5
          delete_tags: true
          delete_tags_pattern: '^ci-release-.*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
